services:
  demux:
    build: .
    image: fastq-demux:latest
    container_name: fastq-demux
    ports:
      - "8000:8000"
    volumes:
      # Job state is memory-only; this volume only holds transient uploads,
      # per-job gzip outputs and the published ZIP.  It is wiped on startup.
      - demux-jobs:/data/jobs
    environment:
      DEMUX_JOBS_ROOT: /data/jobs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  demux-jobs:
